<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Page not found | Aaryan Jha</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #ffffff;
        --cream: #fff9ec;
        --ink: #0a0a0a;
        --grid: #e7e4dc;
        --pink: #ff5fa2;
        --lime: #c8f53d;
        --violet: #7b4dff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--ink);
        background-color: var(--paper);
        background-image:
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 26px 26px;
        font-family: "Space Mono", ui-monospace, monospace;
      }

      main {
        width: min(100%, 960px);
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(280px, 0.95fr);
        border: 3px solid var(--ink);
        background: var(--paper);
        box-shadow: 12px 12px 0 var(--ink);
      }

      .copy {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        gap: 22px;
        padding: clamp(28px, 5vw, 56px);
        border-right: 3px solid var(--ink);
      }

      .code {
        display: inline-block;
        border: 3px solid var(--ink);
        padding: 6px 10px;
        background: var(--lime);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: "Archivo Black", "Arial Black", sans-serif;
        font-size: clamp(46px, 8vw, 84px);
        line-height: 0.9;
        letter-spacing: -0.04em;
        text-transform: uppercase;
      }

      p {
        max-width: 46ch;
        margin: 0;
        color: #4a4742;
        font-size: 14px;
        line-height: 1.65;
      }

      a {
        display: inline-flex;
        align-items: center;
        border: 3px solid var(--ink);
        padding: 12px 18px;
        color: var(--ink);
        background: var(--lime);
        box-shadow: 4px 4px 0 var(--ink);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-decoration: none;
        text-transform: uppercase;
        transition: transform 90ms ease, box-shadow 90ms ease;
      }

      a:hover {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 var(--ink);
      }

      .art {
        display: grid;
        place-items: end center;
        min-height: 420px;
        padding: 28px 20px 0;
        overflow: hidden;
        background: var(--pink);
      }

      img {
        display: block;
        width: min(100%, 400px);
        height: auto;
      }

      @media (max-width: 700px) {
        main {
          grid-template-columns: 1fr;
        }

        .copy {
          border-right: 0;
          border-bottom: 3px solid var(--ink);
        }

        .art {
          min-height: 260px;
        }
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #131211;
          --cream: #1d1b17;
          --ink: #f2ede2;
          --grid: #2a2825;
        }

        p {
          color: #a9a296;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        a {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="copy">
        <span class="code">Error 404</span>
        <h1>Not sure<br />how you<br />got here.</h1>
        <p>The page you followed does not exist. The portfolio is still right where you left it.</p>
        <a href="/">Back to portfolio →</a>
      </section>

      <div class="art" aria-hidden="true">
        <img
          src="/characters/character-shrug-400.webp"
          srcset="
            /characters/character-shrug-160.webp 160w,
            /characters/character-shrug-240.webp 240w,
            /characters/character-shrug-400.webp 400w
          "
          sizes="(max-width: 700px) 80vw, 400px"
          width="400"
          height="267"
          alt=""
          decoding="async"
        />
      </div>
    </main>
  </body>
</html>
